[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishscan"
version = "1.0.0"
description = "Automated phishing email triage: explainable verdicts, IOC extraction, MITRE mapping, CLI and web app."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["phishing", "email", "soc", "security", "dfir", "blue-team"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Intended Audience :: Information Technology",
]
dependencies = [
  "requests>=2.31",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "flask>=3.0",
  "waitress>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[project.scripts]
phishscan = "phishscan.cli:main"

[tool.setuptools.packages.find]
include = ["phishscan*"]

[tool.setuptools.package-data]
phishscan = ["templates/*", "static/*", "samples/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
