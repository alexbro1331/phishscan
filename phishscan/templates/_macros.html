{% macro logo() %}<svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="2.5" y="6.5" width="27" height="19" rx="4.5" stroke="currentColor" stroke-width="2"/><path d="M4.5 9.5 16 18l11.5-8.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="26" cy="7" r="4.2" fill="#e5484d" stroke="var(--panel,#fff)" stroke-width="2"/></svg>{% endmacro %}
{% macro icon(name) %}<svg viewBox="0 0 24 24" aria-hidden="true">{% if name == "dash" %}<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>{% elif name == "upload" %}<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>{% elif name == "cases" %}<path d="M3 13l3-8h12l3 8v6H3zM3 13h5l1 3h6l1-3h5"/>{% elif name == "iocs" %}<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>{% elif name == "settings" %}<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>{% elif name == "search" %}<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>{% elif name == "theme" %}<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.500 17.500 19 19M5 19l1.500-1.500M17.500 6.500 19 5"/>{% elif name == "copy" %}<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>{% elif name == "download" %}<path d="M12 4v11M7 11l5 5 5-5M4 20h16"/>{% elif name == "trash" %}<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>{% elif name == "logout" %}<path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/>{% elif name == "mail" %}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>{% endif %}</svg>{% endmacro %}
{% macro badge(label) %}<span class="badge v-{{ label }}">{{ label }}</span>{% endmacro %}
{% macro status_pill(status) %}<span class="pill {{ status }}">{{ STATUS_LABELS.get(status, status) }}</span>{% endmacro %}
